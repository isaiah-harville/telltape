name: tag

# On merge to main, tag the commit v<version> if the project version
# (uv version) was bumped to a value that isn't tagged yet. The tag is the
# cue to publish a GitHub Release, which kicks off the release builds.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Read project version
        id: ver
        run: echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"

      - name: Tag if version is new
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null \
            || git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists; version unchanged, nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "Release ${tag}"
          git push origin "${tag}"
          echo "Created and pushed ${tag}. Publish a GitHub Release from it to build." >> "$GITHUB_STEP_SUMMARY"
