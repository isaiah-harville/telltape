[project]
name = "telltape"
version = "0.2.1"
description = "Market-moving financial and world news headlines in your terminal."
authors = [
    { name = "Isaiah Harville", email = "isaiah@harville.dev" }
]
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["news", "finance", "trading", "tui", "terminal", "rss", "sec", "edgar"]
dependencies = [
    "click>=8.4.1",
    "feedparser>=6.0.12",
    "httpx>=0.28.1",
    "rapidfuzz>=3.14.5",
    "rich>=15.0.0",
    "textual>=8.2.7",
]

[dependency-groups]
dev = [
    "ruff",
    "ty",
    "pre-commit",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]
build = ["nuitka[onefile]>=2.0"]

[project.urls]
Homepage = "https://github.com/isaiah-harville/telltape"
Repository = "https://github.com/isaiah-harville/telltape"

[project.scripts]
telltape = "telltape:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
